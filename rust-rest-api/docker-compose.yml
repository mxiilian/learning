# Lokale Entwicklungsumgebung: PostgreSQL + Rust-API
#
# Erstmalige Einrichtung:
#   1. docker-compose up db -d
#   2. cargo sqlx prepare --database-url postgresql://postgres:postgres@localhost:5432/korean_learning
#   3. docker-compose up --build
#
# Ab dem zweiten Start genügt: docker-compose up

services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: korean_learning
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d korean_learning"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: Dockerfile
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/korean_learning
      JWT_SECRET: ${JWT_SECRET:-change-me-in-production}
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - ./uploads:/app/uploads

volumes:
  postgres_data:
